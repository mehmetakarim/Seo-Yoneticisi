name: GSC günlük ölçümleri

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: gsc-daily
  cancel-in-progress: false

jobs:
  collect:
    if: >-
      github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'workflow_dispatch' || vars.GSC_DAILY_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment: gsc-daily
    steps:
      - name: Günlük GSC ölçümlerini topla
        env:
          GSC_SUPABASE_PROJECT_REF: ${{ vars.GSC_SUPABASE_PROJECT_REF }}
          TEAM_GSC_DAILY_TOKEN: ${{ secrets.TEAM_GSC_DAILY_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const { GSC_SUPABASE_PROJECT_REF: project, TEAM_GSC_DAILY_TOKEN: token } = process.env;
          if (!/^[a-z0-9]{20}$/.test(project ?? '') || !/^[A-Za-z0-9_-]{32,128}$/.test(token ?? '')) {
            throw new Error('GSC zamanlayıcısının proje veya kimlik bilgisi eksik.');
          }
          const endpoint = `https://${project}.supabase.co/functions/v1/team-gsc-daily-collector`;
          const response = await fetch(endpoint, {
            method: 'POST', redirect: 'error', signal: AbortSignal.timeout(110_000),
            headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ mode: 'collect_daily' }),
          });
          if (!response.ok) throw new Error(`GSC toplama yanıtı HTTP ${response.status}.`);
          const { processed, failed } = await response.json().catch(() => ({})) ?? {};
          if (![processed, failed].every(value => Number.isInteger(value) && value >= 0) || processed + failed > 6) {
            throw new Error('GSC toplama sonucu doğrulanamadı.');
          }
          console.log(`${processed} hedef güncellendi, ${failed} hedef tekrar denenecek.`);
          if (failed > 0) process.exitCode = 1;
          JS
