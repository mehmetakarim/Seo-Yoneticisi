name: release

# v* etiketiyle (ör. v0.1.0) tetiklenir; macOS (.dmg) + Windows (.exe) derleyip
# GitHub Release'e yükler.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: windows-latest
            args: ''
            rust_targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Rust kur
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      # rustls (aws-lc-rs) + jsonwebtoken (ring) Windows'ta assembly için NASM ister
      - name: NASM kur (Windows)
        if: matrix.platform == 'windows-latest'
        uses: ilammy/setup-nasm@v1

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Frontend bağımlılıkları
        run: npm ci

      # Sürüm notları CHANGELOG.md'den gelir. tauri-action bunu HEM GitHub Release gövdesine
      # HEM de latest.json'ın `notes` alanına yazıyor — yani kullanıcının uygulama içindeki
      # güncelleme ekranında gördüğü metin buradan çıkıyor. Tek kaynak, iki yerde görünür.
      - name: Sürüm notlarını CHANGELOG'dan çıkar
        id: notes
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          # "## v0.5.6" satırından bir sonraki "## " başlığına kadar olan bölüm
          BODY=$(awk -v tag="## $TAG" '
            $0 == tag { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)
          # baştaki/sondaki boş satırları at
          BODY=$(printf '%s\n' "$BODY" | sed -e '/./,$!d' -e ':a' -e '/^\n*$/{$d;N;ba' -e '}')
          if [ -z "$BODY" ]; then
            # Bölüm yoksa release ASLA bu yüzden kırılmasın — anlamlı bir metne düş.
            echo "::warning::CHANGELOG.md içinde '## $TAG' bölümü bulunamadı"
            BODY="Bu sürümde yapılan değişiklikler için depodaki CHANGELOG.md dosyasına bakabilirsiniz."
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "--- çıkarılan notlar ---"
          echo "$BODY"

      - name: Derle + Release yükle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Faz 10: otomatik güncelleme imzası (kod imzalamadan bağımsız, ücretsiz minisign)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'SEO Yöneticisi ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          # latest.json üretilip Release'e eklenir → uygulama buradan güncelleme kontrolü yapar
          includeUpdaterJson: true
          args: ${{ matrix.args }}
