[package]
name = "seo-yoneticisi"
version = "0.3.0"
description = "IdeaSoft feed tabanlı SEO yönetim aracı"
authors = ["mehmetakarim"]
edition = "2021"

[lib]
name = "seo_yoneticisi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
quick-xml = { version = "0.37", features = ["serialize"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json", "cookies"] }
unicode-segmentation = "1"
chrono = "0.4"
regex = "1"
# SEO araştırma (Faz 4+): CapSolver polling (time) + eşzamanlı çağrılar (join! → macros).
tokio = { version = "1", features = ["time", "macros"] }
# Faz 5: GSC service-account JWT (RS256) imzalama. Token exchange + API çağrıları reqwest ile.
jsonwebtoken = "9"
# Faz 7: görsel boyutunu decode etmeden başlıktan okur (1:1 + çözünürlük kontrolü).
imagesize = "0.13"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
